name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
      VITE_BASE_PATH: /spanish-mtel-coach/
      PLAYWRIGHT_PASSCODE: ${{ secrets.SITE_PASSCODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Verify passcode secret
        run: |
          if [ -z "$SITE_PASSCODE" ]; then
            echo "::error::SITE_PASSCODE is required for deployment."
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Generate test passcode config
        run: npm run generate:passcode
        env:
          SITE_PASSCODE: test-passcode-for-ci-only
      - name: Check for committed secrets and unsafe patterns
        run: npm run check:no-secrets
      - name: Validate question bank
        run: npm run validate:questions
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm run test
      - name: Generate production passcode config
        run: npm run generate:passcode
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
